name: CEF build stage
description: >-
  Run one resumable stage of a patched CEF build on a GitHub-hosted runner. Each
  stage restores the newest tree saved earlier in the run (or in resume-run), or
  syncs and patches the pinned sources when there is none. It builds until its
  deadline, then either packages the minimal distribution or saves the tree for
  the next stage.
inputs:
  target:
    description: Target such as linux-x64 or windows-arm64
    required: true
  stage:
    description: Stage number starting at 1
    required: true
  budget-minutes:
    description: Minutes after job start at which ninja is stopped gracefully
    required: false
    default: "280"
  resume-run:
    description: An earlier run ID whose newest saved tree for this target replaces the sync when this run has saved none
    required: false
    default: ""
  incremental:
    description: >-
      Linux only: instead of syncing from scratch, update the finished tree an
      earlier build saved as its seed in place, and save this build's finished
      tree as the next build's seed
    required: false
    default: "true"
outputs:
  complete:
    description: Whether every build target finished in this stage
    value: ${{ steps.build.outputs.complete }}
runs:
  using: composite
  steps:
    - name: Record deadline and paths
      shell: bash
      env:
        BUDGET: ${{ inputs.budget-minutes }}
      run: |
        set -euo pipefail
        # Hosted macOS runners start failing file I/O (EILSEQ, lost files, then
        # the runner itself crashes) from about 3h15m into a job. Stop early
        # enough that the restore, build, save and upload all end by about 3h.
        if [ "$RUNNER_OS" = macOS ] && [ "$BUDGET" -gt 165 ]; then
          echo "Capping the macOS build budget at 165 of $BUDGET minutes"
          BUDGET=165
        fi
        echo "CEF_DEADLINE=$(( $(date +%s) + BUDGET * 60 ))" >> "$GITHUB_ENV"
        # Every stage must use the same absolute tree path so ninja state stays valid.
        case "$RUNNER_OS" in
          Linux) tree=/home/runner/cefb; parts=/mnt/cef-parts ;;
          macOS) tree=/Users/runner/cefb; parts=/Users/runner/cef-parts ;;
          Windows) tree=D:/cefb; parts=D:/cef-parts ;;
        esac
        echo "CEF_TREE=$tree" >> "$GITHUB_ENV"
        echo "CEF_PARTS=$parts" >> "$GITHUB_ENV"

    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
          /usr/local/lib/node_modules /opt/google
        sudo docker image prune --all --force >/dev/null || true
        sudo mkdir -p /mnt/cef-parts
        sudo chown "$(id -u):$(id -g)" /mnt/cef-parts
        df -h / /mnt

    - name: Select Xcode and free disk space (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        xcode=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)
        xcode=$(cd -P "$xcode" && pwd)
        sudo xcode-select --switch "$xcode"
        # Remove other Xcodes for disk space; versioned names are often symlinks.
        for other in /Applications/Xcode*.app; do
          if [ ! -L "$other" ] && [ "$(cd -P "$other" && pwd)" != "$xcode" ]; then sudo rm -rf "$other"; fi
        done
        sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet \
          /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator || true
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        # Xcode 26 ships without the Metal toolchain that ANGLE's shader build needs.
        xcrun --find metal >/dev/null 2>&1 && xcrun metal --version >/dev/null 2>&1 || \
          xcodebuild -downloadComponent MetalToolchain
        xcrun metal --version
        df -h /

    - name: Prepare Windows toolchain
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath 'D:\' -ErrorAction SilentlyContinue
        git config --global core.autocrlf false
        git config --global core.filemode false
        git config --global core.longpaths true
        $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0\um\dcomp.h"
        if (-not (Test-Path $sdk)) {
          # Chromium 156 requires Windows SDK 10.0.28000 (build/vs_toolchain.py).
          $setup = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile $setup
          $process = Start-Process $setup -Wait -PassThru -ArgumentList @(
            '/features', 'OptionId.DesktopCPPx64', 'OptionId.DesktopCPPx86',
            'OptionId.DesktopCPParm64', 'OptionId.WindowsDesktopDebuggers',
            'OptionId.SigningTools', '/quiet', '/norestart', '/ceip', 'off')
          if ($process.ExitCode -ne 0) { throw "winsdksetup failed: $($process.ExitCode)" }
          if (-not (Test-Path $sdk)) { throw "Windows SDK 10.0.28000 headers missing after install" }
        }
        Get-PSDrive C, D | Format-Table -AutoSize

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Find tree to resume
      id: source
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESUME_RUN: ${{ inputs.resume-run }}
        TARGET: ${{ inputs.target }}
        STAGE: ${{ inputs.stage }}
        INCREMENTAL: ${{ inputs.incremental }}
      run: |
        set -euo pipefail
        # The newest tree, not the previous stage's: after a stage fails or loses
        # its runner without saving, the retry resumes from the last good tree.
        newest() {
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' \
            | grep -E "^tree-$TARGET-[0-9]+$" | awk -F- '{ print $NF, $0 }' | sort -n | tail -1 | cut -d' ' -f2 || true
        }
        name=$(newest "$GITHUB_RUN_ID")
        if [ -n "$name" ]; then
          echo "Resuming $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        elif [ -n "$RESUME_RUN" ] && name=$(newest "$RESUME_RUN") && [ -n "$name" ]; then
          echo "Resuming $name from run $RESUME_RUN"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run=$RESUME_RUN" >> "$GITHUB_OUTPUT"
        elif [ "$INCREMENTAL" = true ] && [[ "$TARGET" == linux-* ]] && seed=$(
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=seed-$TARGET&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty'
        ) && [ -n "$seed" ]; then
          echo "::notice::Updating the finished $TARGET tree of run $seed in place"
          echo "name=seed-$TARGET" >> "$GITHUB_OUTPUT"
          echo "run=$seed" >> "$GITHUB_OUTPUT"
          echo "seed=true" >> "$GITHUB_OUTPUT"
        elif [ "$STAGE" != 1 ] || [ -n "$RESUME_RUN" ]; then
          echo "::notice::No saved $TARGET tree to resume; syncing from scratch"
        fi

    # A seed that fails to download, restore or update falls back to a fresh sync.
    - name: Download previous tree
      id: download
      if: steps.source.outputs.name != ''
      continue-on-error: ${{ steps.source.outputs.seed == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.source.outputs.name }}
        run-id: ${{ steps.source.outputs.run || github.run_id }}
        github-token: ${{ steps.source.outputs.run && github.token || '' }}
        path: ${{ env.CEF_PARTS }}/in

    - name: Restore previous tree
      id: restore
      if: steps.source.outputs.name != '' && steps.download.outcome == 'success'
      continue-on-error: ${{ steps.source.outputs.seed == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "$CEF_PARTS/in/host-arch.txt" ]; then
          echo "::error::Saved tree has no host architecture metadata; start a fresh build."
          exit 1
        fi
        if [ "$(tr -d '\r\n' < "$CEF_PARTS/in/host-arch.txt")" != "$(uname -m)" ]; then
          echo "::error::Saved tree was built on a different host architecture; start a fresh build."
          exit 1
        fi
        pwsh -NoProfile -File scripts/tree.ps1 -Mode unpack -Parts "$CEF_PARTS/in" -Directory "$CEF_TREE"

    - name: Update the seed tree in place
      id: update
      if: steps.source.outputs.seed == 'true' && steps.restore.outcome == 'success'
      continue-on-error: true
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        # In a child process: update.ps1 changes the environment it runs in.
        pwsh -NoProfile -File ./scripts/update.ps1 -Directory $env:CEF_TREE -Target $env:TARGET `
          -Record (Join-Path $env:RUNNER_TEMP 'cef-update-reverted.json')
        if ($LASTEXITCODE -ne 0) { throw "Updating the seed tree failed: $LASTEXITCODE" }

    - name: Sync, patch, and generate build files
      if: steps.source.outputs.name == '' || (steps.source.outputs.seed == 'true' && steps.update.outcome != 'success')
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (Test-Path -LiteralPath $env:CEF_TREE) {
          Write-Host '::warning::The seed tree could not be updated in place; syncing from scratch'
          Remove-Item -LiteralPath $env:CEF_TREE -Recurse -Force
        }
        $parts = Join-Path $env:CEF_PARTS 'in'
        if (Test-Path -LiteralPath $parts) { Remove-Item -LiteralPath $parts -Recurse -Force }
        ./scripts/sync.ps1 -Directory $env:CEF_TREE -Target $env:TARGET

    - name: Build until deadline
      id: build
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: ./scripts/build.ps1 -Directory $env:CEF_TREE -Target $env:TARGET -Deadline $env:CEF_DEADLINE

    - name: Create minimal distribution and verify patched exports
      id: distrib
      if: steps.build.outputs.complete == 'true'
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        $ErrorActionPreference = 'Stop'
        # distrib.ps1 runs in this process and removes TARGET from its environment.
        $platform, $arch = $env:TARGET.Split('-')
        & ./scripts/distrib.ps1 -Directory $env:CEF_TREE -Target $env:TARGET
        $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
        & ./scripts/release.ps1 -Build $env:CEF_TREE -Output $candidate `
          -Platform $platform -Arch $arch -Revision $env:GITHUB_SHA

    - name: Upload candidate
      if: steps.build.outputs.complete == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-${{ inputs.target }}
        path: ${{ runner.temp }}/candidate/*
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

    # The next Linux build updates this finished tree in place and rebuilds only
    # what changed (about a fifth of the build for a Chromium patch release). A
    # seed that fails to save costs that build a fresh sync, not this one.
    - name: Save finished tree as the next build's seed
      id: seed
      if: steps.build.outputs.complete == 'true' && inputs.incremental == 'true' && startsWith(inputs.target, 'linux-')
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        # The deadline leaves 75 minutes of the job; saving takes up to about 35.
        if [ "$(date +%s)" -gt $(( CEF_DEADLINE + 40 * 60 )) ]; then
          echo "::warning::Too little job time left to save the seed; the next build syncs from scratch"
          exit 1
        fi
        rm -rf "$CEF_TREE/chromium/src/cef/binary_distrib" "$CEF_PARTS/in" "$CEF_PARTS/seed"
        df -h "$CEF_TREE" "$CEF_PARTS" || true
        pwsh -NoProfile -File scripts/tree.ps1 -Mode pack -Directory "$CEF_TREE" -Output "$CEF_PARTS/seed"
        uname -m > "$CEF_PARTS/seed/host-arch.txt"
        ls -la "$CEF_PARTS/seed"

    - name: Upload seed
      if: steps.seed.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: seed-${{ inputs.target }}
        path: ${{ env.CEF_PARTS }}/seed/*
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    # A finished build whose distribution fails keeps its tree, so a retry stage
    # or resume-run redoes only the distribution instead of the last build stage.
    - name: Save tree for next stage
      id: save
      if: steps.build.outputs.complete == 'false' || (failure() && steps.distrib.outcome == 'failure')
      shell: bash
      run: |
        set -euo pipefail
        df -h "$CEF_TREE" || true
        pwsh -NoProfile -File scripts/tree.ps1 -Mode pack -Directory "$CEF_TREE" -Output "$CEF_PARTS/out"
        uname -m > "$CEF_PARTS/out/host-arch.txt"
        ls -la "$CEF_PARTS/out"

    # Only a tree that saved and verified completely: a partial one would be the
    # newest tree a retried stage resumes from.
    - name: Upload tree
      if: ${{ !cancelled() && steps.save.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tree-${{ inputs.target }}-${{ inputs.stage }}
        path: ${{ env.CEF_PARTS }}/out/*
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
