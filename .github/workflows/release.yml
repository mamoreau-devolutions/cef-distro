name: Publish release
on:
  workflow_call:
    inputs:
      runs:
        type: string
        required: true
      targets:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false
      skip-macos:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runs:
        description: JSON list of build run IDs to take candidates from; earlier runs win
        type: string
        required: true
      targets:
        description: JSON list of targets the release must contain
        type: string
        default: '["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]'
      dry-run:
        description: Verify candidates without publishing a release
        type: boolean
        default: false
      skip-macos:
        description: Drop macOS targets from the list (macOS builds are deferred, not removed)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  plan:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/auto/cef-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: targets
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
          SKIP_MACOS: ${{ inputs.skip-macos }}
        run: |
          $targets = ./scripts/targets.ps1 -Targets $env:TARGETS -SkipMacOS:($env:SKIP_MACOS -eq 'true')
          "targets=$targets" >> $env:GITHUB_OUTPUT

  native-smoke:
    needs: plan
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-smoke.yml
    with:
      runs: ${{ inputs.runs }}
      targets: ${{ needs.plan.outputs.targets }}

  # IronRDP's browser suites against the Windows x64 candidate: the runtime
  # check that the patches still do what they are for.
  ironrdp-e2e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets), 'windows-x64')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ironrdp-e2e.yml
    with:
      runs: ${{ inputs.runs }}

  release:
    needs: [plan, native-smoke, ironrdp-e2e]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.native-smoke.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.ironrdp-e2e.result) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          for run in $(echo "$RUNS" | jq -r '.[]'); do
            gh run download "$run" -R "$GITHUB_REPOSITORY" -p 'candidate-*' -D "candidates/$run"
          done
      - name: Download native smoke results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-smoke-*
          path: native-smoke
      - name: Verify and assemble candidates
        shell: pwsh
        env:
          RUNS: ${{ inputs.runs }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(ConvertFrom-Json -InputObject $env:RUNS | ForEach-Object { Join-Path 'candidates' "$_" })
          & ./scripts/publish.ps1 -Source $sources -Targets $env:TARGETS -SmokeProofs 'native-smoke' -Output 'verified'
      - name: Read exporter revision
        id: pins
        run: echo "cef_rs=$(jq -r .cef_rs_commit pins.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tauri-apps/cef-rs
          ref: ${{ steps.pins.outputs.cef_rs }}
          path: cef-rs
      # Each package is the pinned exporter's CEF_PATH directory for the verified
      # archive, so consumers extract it and point CEF_PATH at it.
      - name: Package candidates with the pinned cef-rs exporter
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: bash scripts/package.sh verified "$TARGETS" cef-rs release "$(git log -1 --format=%ct)"
      - name: Publish release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ inputs.runs }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          version=$(jq -r .cef_version pins.json)
          upstream=${version%%+*}
          # The first release of an upstream version is tagged v156.0.31; later
          # releases of it (after a patch change) v156.0.31-2, -3, ...
          base="v$upstream"
          last=$(gh release list --limit 1000 --json tagName --jq "[.[].tagName |
            if . == \"$base\" then 1 elif startswith(\"$base-\") then ltrimstr(\"$base-\") else empty end |
            tostring | select(test(\"^[0-9]{1,4}$\")) | tonumber] | max // 0")
          number=$((last + 1))
          tag=$base
          if [ "$number" -gt 1 ]; then tag="$base-$number"; fi
          # Only a release with every supported target is a full release.
          prerelease=()
          if [ "$(echo "$TARGETS" | jq 'length')" -lt 6 ]; then prerelease=(--prerelease); fi
          links=$(echo "$RUNS" | jq -r --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs" \
            'map("[\(.)](\($url)/\(.))") | join(", ")')
          {
            echo "CEF \`$version\` with this repository's patches, built by run(s) $links; published from \`$GITHUB_SHA\`."
            echo
            echo "Targets: $(echo "$TARGETS" | jq -r 'join(", ")'). Each \`cef-$upstream-<target>.tar.gz\` is a ready \`CEF_PATH\` for cef-rs: extract it and point \`CEF_PATH\` at the \`cef-$upstream-<target>\` directory. Each \`manifest-<target>.json\` records the repository commit, pins, patch blobs, the source distribution's SHA-256 and the package's."
            echo
            echo "Each package is the pinned cef-rs exporter's import of the unmodified CEF \`--minimal\` distribution produced by \`make_distrib.py\`; CI verified the patch blobs, the pinned upstream checkouts, and the 14 patched exports in libcef, and checked each package's library architecture and essential files."
            echo "Native CI loaded each library and checked the disabled-clipboard getters without initializing CEF. This is not a substitute for the IronRDP native tests."
            if ! echo "$TARGETS" | jq -e 'any(.[]; startswith("macos-"))' >/dev/null; then
              echo
              echo "macOS is not included in this release; macOS builds are pending."
            fi
          } > notes.md
          # A reviewed auto/cef-* branch becomes master first; the push is
          # fast-forward only, so it fails if master has moved on.
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            git push origin "$GITHUB_SHA:refs/heads/master"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" "${prerelease[@]}" \
            --title "CEF ${tag#v}" --notes-file notes.md -- release/*
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
