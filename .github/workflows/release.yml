name: Publish release
on:
  workflow_call:
    inputs:
      runs:
        type: string
        required: true
      targets:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false
      skip-macos:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runs:
        description: JSON list of build run IDs to take candidates from; earlier runs win
        type: string
        required: true
      targets:
        description: JSON list of targets the release must contain
        type: string
        default: '["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]'
      dry-run:
        description: Verify candidates without publishing a release
        type: boolean
        default: false
      skip-macos:
        description: Drop macOS targets from the list (macOS builds are deferred, not removed)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: targets
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
          SKIP_MACOS: ${{ inputs.skip-macos }}
        run: |
          $targets = ./scripts/targets.ps1 -Targets $env:TARGETS -SkipMacOS:($env:SKIP_MACOS -eq 'true')
          "targets=$targets" >> $env:GITHUB_OUTPUT

  native-smoke:
    needs: plan
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-smoke.yml
    with:
      runs: ${{ inputs.runs }}
      targets: ${{ needs.plan.outputs.targets }}

  release:
    needs: [plan, native-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          for run in $(echo "$RUNS" | jq -r '.[]'); do
            gh run download "$run" -R "$GITHUB_REPOSITORY" -p 'candidate-*' -D "candidates/$run"
          done
      - name: Download native smoke results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-smoke-*
          path: native-smoke
      - name: Verify and assemble candidates
        shell: pwsh
        env:
          RUNS: ${{ inputs.runs }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(ConvertFrom-Json -InputObject $env:RUNS | ForEach-Object { Join-Path 'candidates' "$_" })
          & ./scripts/publish.ps1 -Source $sources -Targets $env:TARGETS -SmokeProofs 'native-smoke' -Output 'release'
      - name: Read exporter revision
        id: pins
        run: echo "cef_rs=$(jq -r .cef_rs_commit pins.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tauri-apps/cef-rs
          ref: ${{ steps.pins.outputs.cef_rs }}
          path: cef-rs
      - name: Smoke-test real archives with the pinned cef-rs exporter
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            case "$target" in
              linux-x64) rust_target=x86_64-unknown-linux-gnu; library=libcef.so; expected='ELF 64-bit.*x86-64' ;;
              linux-arm64) rust_target=aarch64-unknown-linux-gnu; library=libcef.so; expected='ELF 64-bit.*aarch64' ;;
              windows-x64) rust_target=x86_64-pc-windows-msvc; library=libcef.dll; expected='PE32\+.*x86-64' ;;
              windows-arm64) rust_target=aarch64-pc-windows-msvc; library=libcef.dll; expected='PE32\+.*(aarch64|arm64)' ;;
              macos-x64) rust_target=x86_64-apple-darwin; library='Chromium Embedded Framework.framework/Chromium Embedded Framework'; expected='Mach-O 64-bit.*x86_64' ;;
              macos-arm64) rust_target=aarch64-apple-darwin; library='Chromium Embedded Framework.framework/Chromium Embedded Framework'; expected='Mach-O 64-bit.*arm64' ;;
              *) echo "::error::Unsupported target: $target"; exit 1 ;;
            esac
            archive="$GITHUB_WORKSPACE/release/$(jq -r .archive "release/manifest-$target.json")"
            work="$RUNNER_TEMP/cef-export-smoke-$target"
            mkdir -p "$work"
            cargo run --quiet --manifest-path cef-rs/Cargo.toml -p export-cef-dir -- \
              --archive "$archive" --target "$rust_target" "$work/output"
            output="$work/output"
            test -f "$output/$library"
            file -Lb "$output/$library" | tee /dev/stderr | grep -iE "$expected"
            test -f "$output/include/cef_app.h"
            case "$target" in
              linux-*) test -f "$output/chrome-sandbox"; test -f "$output/icudtl.dat" ;;
              windows-*) test -f "$output/bootstrap.exe"; test -f "$output/bootstrapc.exe"; test -f "$output/icudtl.dat" ;;
              # CEF's distribution ships a flat framework; -f also follows a versioned layout's links.
              macos-*) test -f "$output/Chromium Embedded Framework.framework/Resources/Info.plist"
                test -f "$output/Chromium Embedded Framework.framework/Resources/icudtl.dat" ;;
            esac
            sha1=$(sha1sum "$archive" | cut -d' ' -f1)
            jq -e --arg name "$(basename "$archive")" --arg sha1 "$sha1" \
              '.type == "minimal" and .name == $name and .sha1 == $sha1' "$output/archive.json" >/dev/null
            rm -rf -- "$work"
          done
      - name: Publish release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ inputs.runs }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          version=$(jq -r .cef_version pins.json)
          # Releases of one upstream version count up: cef-156.0.31-patched.1, .2, ...
          # Older tags ended in a run ID; their long suffixes are not counted.
          base="cef-${version%%+*}-patched"
          last=$(gh release list --limit 1000 --json tagName \
            --jq "[.[].tagName | select(startswith(\"$base.\")) | ltrimstr(\"$base.\") | select(test(\"^[0-9]{1,4}$\")) | tonumber] | max // 0")
          number=$((last + 1))
          tag="$base.$number"
          # Only a release with every supported target is a full release.
          prerelease=()
          if [ "$(echo "$TARGETS" | jq 'length')" -lt 6 ]; then prerelease=(--prerelease); fi
          links=$(echo "$RUNS" | jq -r --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs" \
            'map("[\(.)](\($url)/\(.))") | join(", ")')
          {
            echo "Patched CEF \`$version\` built by run(s) $links; published from \`$GITHUB_SHA\`."
            echo
            echo "Targets: $(echo "$TARGETS" | jq -r 'join(", ")'). Each \`manifest-<target>.json\` records the repository commit, pins, and patch blobs of that build."
            echo
            echo "Each archive is the unmodified CEF \`--minimal\` distribution produced by \`make_distrib.py\`; CI verified the patch blobs, the pinned upstream checkouts, and the 14 patched exports in libcef."
            echo "CI also smoke-tested importing each archive with the pinned cef-rs exporter and checked the library architecture."
            echo "Native CI loaded each library and checked the disabled-clipboard getters without initializing CEF. This is not a substitute for the IronRDP native tests."
            if ! echo "$TARGETS" | jq -e 'any(.[]; startswith("macos-"))' >/dev/null; then
              echo
              echo "macOS is not included in this release; macOS builds are pending."
            fi
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" "${prerelease[@]}" \
            --title "Patched CEF ${version%%+*} (release $number)" --notes-file notes.md \
            -- release/*
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
