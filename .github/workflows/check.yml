name: Patch checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check patch applicability against pinned sources
        run: pwsh -File scripts/check-patches.ps1
      - name: Check orchestration
        run: |
          pwsh -File scripts/stages.ps1 -Check
          pwsh -File tests/test_publish.ps1
          python3 -m unittest discover -s tests -v
      - name: Hosted runner capacity
        run: |
          df -h .
          free -h
  distrib-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check distribution invocation
        shell: pwsh
        run: ./tests/test_distrib.ps1
  exporter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tauri-apps/cef-rs
          ref: 9aa78c450489eddb828eb982eaee6c104a89d348
          path: cef-rs
      - name: Exercise pinned exporter with a synthetic CEF archive
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cef-export-smoke"
          name='cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linux64_minimal'
          root="$work/$name"
          mkdir -p "$root"/{Release,Resources,cmake,include,libcef_dll}
          printf 'library' > "$root/Release/libcef.so"
          printf 'sandbox' > "$root/Release/chrome-sandbox"
          printf 'resource' > "$root/Resources/test.pak"
          touch "$root/CMakeLists.txt" "$root/CREDITS.html"
          tar -C "$work" -cjf "$work/$name.tar.bz2" "$name"
          cargo run --manifest-path cef-rs/Cargo.toml -p export-cef-dir -- \
            --archive "$work/$name.tar.bz2" --target x86_64-unknown-linux-gnu "$work/output"
          test "$(cat "$work/output/libcef.so")" = library
          test "$(cat "$work/output/chrome-sandbox")" = sandbox
          test "$(cat "$work/output/test.pak")" = resource
          ARCHIVE_JSON="$work/output/archive.json" ARCHIVE_NAME="$name.tar.bz2" pwsh -NoProfile -Command \
            '$p = Get-Content -Raw -LiteralPath $env:ARCHIVE_JSON | ConvertFrom-Json; if ($p.type -cne "minimal" -or $p.name -cne $env:ARCHIVE_NAME -or $p.sha1.Length -ne 40) { throw "Invalid exporter archive metadata" }'
      - name: Exercise macOS framework symlink export
        shell: bash
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            case "$arch" in
              x64) target=x86_64-apple-darwin; cpu=0x01000007; expected=x86_64 ;;
              arm64) target=aarch64-apple-darwin; cpu=0x0100000c; expected=arm64 ;;
            esac
            work="$RUNNER_TEMP/cef-export-macos-$arch"
            name="cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_macos${arch}_minimal"
            root="$work/$name"
            framework="$root/Release/Chromium Embedded Framework.framework"
            mkdir -p "$framework/Versions/A/Resources" "$root"/{cmake,include,libcef_dll}
            MACHO_PATH="$framework/Versions/A/Chromium Embedded Framework" MACHO_CPU="$cpu" pwsh -NoProfile -Command \
              '$words = [uint32[]]@([Convert]::ToUInt32("feedfacf", 16), [Convert]::ToUInt32($env:MACHO_CPU, 16), 0, 6, 0, 0, 0, 0); $bytes = [byte[]]::new(32); [Buffer]::BlockCopy($words, 0, $bytes, 0, 32); [IO.File]::WriteAllBytes($env:MACHO_PATH, $bytes)'
            ln -s A "$framework/Versions/Current"
            ln -s 'Versions/Current/Chromium Embedded Framework' "$framework/Chromium Embedded Framework"
            ln -s Versions/Current/Resources "$framework/Resources"
            touch "$root/CMakeLists.txt" "$root/CREDITS.html" "$root/include/cef_app.h"
            tar -C "$work" -cjf "$work/$name.tar.bz2" "$name"
            cargo run --quiet --manifest-path cef-rs/Cargo.toml -p export-cef-dir -- \
              --archive "$work/$name.tar.bz2" --target "$target" "$work/output"
            exported="$work/output/Chromium Embedded Framework.framework"
            test -L "$exported/Versions/Current"
            test -L "$exported/Chromium Embedded Framework"
            file -Lb "$exported/Chromium Embedded Framework" | grep -iE "Mach-O 64-bit.*$expected"
          done
