name: Build patched CEF
on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON list of targets to build
        type: string
        default: '["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]'
      publish:
        description: Publish a prerelease when every requested target succeeds
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    name: ${{ matrix.target }}
    uses: ./.github/workflows/build-target.yml
    with:
      target: ${{ matrix.target }}

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidates
      - name: Verify candidates and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          mkdir release
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            dir="candidates/candidate-$target"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            jq -e --arg sha "$GITHUB_SHA" '.repository_commit == $sha' "$dir/manifest.json" >/dev/null
            cp "$dir"/*.tar.bz2 release/
            cp "$dir/manifest.json" "release/manifest-$target.json"
            cat "$dir/SHA256SUMS" >> release/SHA256SUMS
          done
          version=$(jq -r .cef_version pins.json)
          tag="cef-${version%%+*}-patched.${GITHUB_RUN_NUMBER}"
          {
            echo "Patched CEF \`$version\` built by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`."
            echo
            echo "Targets: $(echo "$TARGETS" | jq -r 'join(", ")')."
            echo
            echo "Each archive is the unmodified CEF \`--minimal\` distribution produced by \`make_distrib.py\`; CI verified the patch blobs, the pinned upstream checkouts, and the 14 patched exports in libcef."
            echo "Runtime behavior has **not** been validated by CI. Run the IronRDP native tests before relying on a platform."
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Patched CEF ${version%%+*} (build ${GITHUB_RUN_NUMBER})" --notes-file notes.md \
            -- release/*
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
