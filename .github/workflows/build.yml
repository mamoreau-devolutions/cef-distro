name: Build patched CEF
on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON list of targets to build
        type: string
        default: '["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]'
      skip-macos:
        description: Drop macOS targets from the list (macOS builds are deferred, not removed)
        type: boolean
        default: false
      publish:
        description: Publish a prerelease when every requested target succeeds
        type: boolean
        default: true
      stage-minutes:
        description: Minutes each stage builds before saving the tree (lower only to test resumption)
        type: string
        default: "280"
      resume-run:
        description: Earlier run ID whose newest saved trees seed stage 1 (targets without one sync from scratch)
        type: string
        default: ""
      incremental:
        description: Linux targets update the previous build's finished tree in place instead of syncing from scratch
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.targets }}
  cancel-in-progress: false
jobs:
  plan:
    # auto/cef-* branches carry patches Fix patches rebased and Copilot approved.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/auto/cef-')
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: targets
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
          SKIP_MACOS: ${{ inputs.skip-macos }}
        run: |
          $targets = ./scripts/targets.ps1 -Targets $env:TARGETS -SkipMacOS:($env:SKIP_MACOS -eq 'true')
          "targets=$targets" >> $env:GITHUB_OUTPUT

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: ${{ matrix.target }}
    uses: ./.github/workflows/build-target.yml
    with:
      target: ${{ matrix.target }}
      stage-minutes: ${{ inputs.stage-minutes }}
      resume-run: ${{ inputs.resume-run }}
      incremental: ${{ inputs.incremental }}

  release:
    needs: [plan, build]
    # A stage that failed and was retried still fails its target's job, so do not
    # require success here: release.yml refuses targets without a candidate.
    if: ${{ !cancelled() && inputs.publish }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      runs: '[${{ github.run_id }}]'
      targets: ${{ needs.plan.outputs.targets }}
