name: Probe tree packing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check tree round trip
        shell: pwsh
        run: ./tests/test_tree.ps1
      - name: Check Windows tree serialization
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_windows_tree.ps1
