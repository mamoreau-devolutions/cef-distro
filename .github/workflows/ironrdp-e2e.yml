name: IronRDP e2e
on:
  workflow_call:
    inputs:
      runs:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      runs:
        description: JSON list of build run IDs; the first with a Windows x64 candidate is tested
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  e2e:
    name: IronRDP e2e (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download the Windows x64 candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          foreach ($run in (ConvertFrom-Json -InputObject $env:RUNS)) {
            gh run download $run -R $env:GITHUB_REPOSITORY -n candidate-windows-x64 -D candidate
            if ($LASTEXITCODE -eq 0) { Write-Host "Testing the Windows x64 candidate from run $run"; exit 0 }
          }
          throw 'None of the runs has a Windows x64 candidate'
      - name: Find the IronRDP and cef-rs revisions to test with
        id: pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/candidate.ps1
          # The IronRDP revision whose suites gate releases; not a build pin.
          $tests = Get-Content -Raw ironrdp-tests.json | ConvertFrom-Json
          # The cef-rs release for the candidate's CEF version, which IronRDP needs to use it.
          $version = (Get-Content -Raw candidate/manifest.json | ConvertFrom-Json).pins.cef_version.Split('+')[0]
          $cefRs = Get-CefRsCommit $version
          if (-not $cefRs) { throw "cef-rs has no release for CEF $version yet, so IronRDP cannot use this candidate" }
          Write-Host "CEF ${version}: cef-rs $cefRs, IronRDP tests $($tests.ironrdp_commit)"
          "ironrdp=$($tests.ironrdp_commit)" >> $env:GITHUB_OUTPUT
          "cef_rs=$cefRs" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Devolutions/IronRDP
          ref: ${{ steps.pins.outputs.ironrdp }}
          path: ironrdp
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tauri-apps/cef-rs
          ref: ${{ steps.pins.outputs.cef_rs }}
          path: cef-rs
          persist-credentials: false
      - name: Export the candidate with that cef-rs exporter
        shell: pwsh
        run: |
          $archive = Get-ChildItem candidate -Filter '*.tar.bz2' | Select-Object -First 1
          cargo run --quiet --manifest-path cef-rs/Cargo.toml -p export-cef-dir -- `
            --target x86_64-pc-windows-msvc --archive $archive.FullName "$env:RUNNER_TEMP\cef"
          if ($LASTEXITCODE -ne 0) { throw 'Export failed' }
      # Real-time scanning holds files in fresh browser profiles open, so the
      # server's profile removal at shutdown fails on hosted runners. The build
      # stages turn it off for the same reason.
      - name: Stop real-time malware scanning
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP -ErrorAction SilentlyContinue
      - name: Build IronRDP against it and run the browser suites
        shell: pwsh
        run: |
          ./scripts/ironrdp-e2e.ps1 -IronRdp ironrdp -Cef "$env:RUNNER_TEMP\cef" -Artifacts "$env:RUNNER_TEMP\e2e" `
            -CefRs '${{ steps.pins.outputs.cef_rs }}'
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironrdp-e2e-windows-x64
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14
