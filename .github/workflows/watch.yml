name: Follow upstream CEF
on:
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Commit the new pins and start a published build (otherwise only report)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: follow-upstream
  cancel-in-progress: false
jobs:
  follow:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Scheduled runs change pins only when the repository variable opts in.
      APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'schedule' && vars.CEF_AUTO_UPDATE == 'true') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Find the newest stable release on the pinned branch
        id: upstream
        shell: pwsh
        run: ./scripts/upstream.ps1 -Write
      - name: Check that the patches apply to it
        id: patches
        if: steps.upstream.outputs.update == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pwsh -File scripts/check-patches.ps1 2>&1 | tee "$RUNNER_TEMP/patches.log"
      - name: Commit the pins and start a published build
        if: steps.upstream.outputs.update == 'true' && steps.patches.outcome == 'success' && env.APPLY == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.selected_cef_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(pins): follow CEF ${VERSION%%+*}" -m "Pins CEF $VERSION from the pinned branch; the patches apply unchanged." -- pins.json
          git push origin HEAD:master
          gh workflow run build.yml --ref master
          echo "Pinned CEF $VERSION and started a published build"
      - name: Fix or report patches that no longer apply
        if: steps.upstream.outputs.update == 'true' && steps.patches.outcome == 'failure'
        env:
          VERSION: ${{ steps.upstream.outputs.selected_cef_version }}
          RELEASE: ${{ steps.upstream.outputs.selected }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Fix patches rebases them (with Copilot for conflicts), once per release.
          if [ "$APPLY" = true ] && ! git ls-remote --exit-code --heads origin "auto/cef-$RELEASE" > /dev/null; then
            gh workflow run fix-patches.yml --ref master -f version="$RELEASE"
            echo "The patches do not apply to CEF $VERSION; started Fix patches"
            exit 0
          fi
          {
            echo "The patches do not apply to CEF \`$VERSION\`, so it was not pinned or built."
            echo
            if [ "$APPLY" = true ]; then
              echo "**Fix patches** already ran for this release (branch \`auto/cef-$RELEASE\`); see its issue or pull request. Delete that branch to let it try again. Details: $RUN_URL"
            else
              echo "Automatic updates are off, so **Fix patches** was not started. Details: $RUN_URL"
            fi
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/patches.log"
            echo '```'
          } > body.md
          ./scripts/issue.sh "Patches do not apply to the newest CEF release" body.md
          exit 1
      - name: Report a newer stable CEF milestone
        if: steps.upstream.outputs.new_major != ''
        env:
          MAJOR: ${{ steps.upstream.outputs.new_major }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "CEF $MAJOR has a stable release for every target. Moving to it changes the pinned branch, depot_tools and the cef-rs revision, so it needs an explicit decision and coordinated consumer changes; this workflow keeps following the pinned branch until then." > body.md
          ./scripts/issue.sh "CEF $MAJOR is stable" body.md
