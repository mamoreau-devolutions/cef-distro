name: Native candidate smoke
on:
  workflow_call:
    inputs:
      runs:
        type: string
        required: true
      targets:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      runs:
        description: JSON list of build run IDs to search for candidates
        type: string
        required: true
      targets:
        description: JSON list of targets to smoke-test
        type: string
        default: '["linux-x64", "linux-arm64", "windows-x64", "windows-arm64", "macos-x64", "macos-arm64"]'
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","windows-x64":"windows-2025","windows-arm64":"windows-11-arm","macos-x64":"macos-15-intel","macos-arm64":"macos-26"}')[matrix.target] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="candidate-$TARGET"
          found=false
          for run in $(echo "$RUNS" | jq -r '.[]' | tr -d '\r'); do
            names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name' | tr -d '\r')
            if printf '%s\n' "$names" | grep -Fxq "$name"; then
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D candidate
              found=true
              break
            fi
          done
          if [ "$found" != true ]; then echo "::error::No candidate for $TARGET"; exit 1; fi
      - name: Verify candidate
        id: candidate
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/candidate.ps1
          Assert-PatchIdentity
          $candidate = Get-VerifiedCandidate 'candidate' $env:TARGET
          "archive=$($candidate.Archive)" >> $env:GITHUB_OUTPUT
          "sha256=$($candidate.Manifest.sha256)" >> $env:GITHUB_OUTPUT
      - name: Load patched library and check disabled clipboard state
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          CEF_ARCHIVE: ${{ steps.candidate.outputs.archive }}
          CEF_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          ./scripts/native-smoke.ps1 -Target $env:TARGET -Archive $env:CEF_ARCHIVE -Checksum $env:CEF_SHA256
      - name: Record tested archive checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/archive.sha256
          if-no-files-found: error
          retention-days: 7
