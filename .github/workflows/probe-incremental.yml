name: Probe incremental update
# Restores a tree saved by an earlier version's build, moves it to the versions
# in pins.json with scripts/update.ps1 as an incremental build does, runs the
# dirty generators, and counts what ninja would rebuild. Nothing is built or
# uploaded except the probe's records.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target of the saved tree
        required: true
        type: choice
        options: [linux-x64, linux-arm64, windows-x64, windows-arm64, macos-x64, macos-arm64]
      run:
        description: Build run that saved the tree
        required: true
        type: string
      artifact:
        description: Exact tree artifact name, such as tree-macos-x64-1
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04","windows-x64":"windows-2025","windows-arm64":"windows-2025","macos-x64":"macos-26","macos-arm64":"macos-26"}')[inputs.target] }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Record paths
        shell: bash
        run: |
          set -euo pipefail
          # The same absolute tree path as the build stages, so ninja state stays valid.
          case "$RUNNER_OS" in
            Linux) tree=/home/runner/cefb; parts=/mnt/cef-parts ;;
            macOS) tree=/Users/runner/cefb; parts=/Users/runner/cef-parts ;;
            Windows) tree=D:/cefb; parts=D:/cef-parts ;;
          esac
          echo "CEF_TREE=$tree" >> "$GITHUB_ENV"
          echo "CEF_PARTS=$parts" >> "$GITHUB_ENV"
          echo "PROBE=$RUNNER_TEMP/probe" >> "$GITHUB_ENV"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules /opt/google
          sudo docker image prune --all --force >/dev/null || true
          sudo mkdir -p /mnt/cef-parts
          sudo chown "$(id -u):$(id -g)" /mnt/cef-parts

      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)
          sudo xcode-select --switch "$(cd -P "$xcode" && pwd)"
          xcrun --find metal >/dev/null 2>&1 && xcrun metal --version >/dev/null 2>&1 || \
            xcodebuild -downloadComponent MetalToolchain

      - name: Prepare Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath 'D:\' -ErrorAction SilentlyContinue
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.longpaths true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download saved tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
          path: ${{ env.CEF_PARTS }}/in

      - name: Restore saved tree
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/tree.ps1 -Mode unpack -Parts "$CEF_PARTS/in" -Directory "$CEF_TREE"
          rm -rf "$CEF_PARTS/in"
          df -h "$CEF_TREE"

      - name: Update the tree in place and count what ninja would rebuild
        shell: pwsh
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_RUN: ${{ inputs.run }}
          SOURCE_ARTIFACT: ${{ inputs.artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/candidate.ps1
          $tree = $env:CEF_TREE
          $target = $env:TARGET
          function Probe([string]$Phase) {
            python scripts/incremental-probe.py $Phase --tree $tree --target $target --state $env:PROBE
          }
          New-Item -ItemType Directory -Force -Path $env:PROBE | Out-Null
          Probe baseline
          # In a child process: update.ps1 changes the environment it runs in.
          pwsh -NoProfile -File scripts/update.ps1 -Directory $tree -Target $target `
            -Record (Join-Path $env:PROBE 'modified.json')
          $watch = [Diagnostics.Stopwatch]::StartNew()
          Probe generate
          Write-Host ('Run the dirty generators: {0:N1} min' -f $watch.Elapsed.TotalMinutes)
          Probe count
          $summary = Get-Content -Raw (Join-Path $env:PROBE 'summary.json') | ConvertFrom-Json
          @(
            "### Incremental update probe: $target"
            ''
            "From ``$env:SOURCE_ARTIFACT`` of run $env:SOURCE_RUN to CEF $($CefPins.cef_version)."
            ''
            "| Steps | Count |"
            "|---|---|"
            "| Generator steps run for real | $($summary.generator_steps_run) |"
            "| Pending in the saved tree | $($summary.pending_before_update) |"
            "| Pending after the update | $($summary.pending_after_update) |"
            "| Added by the update | $($summary.added_by_update) |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload probe records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incremental-probe-${{ inputs.target }}
          path: ${{ env.PROBE }}/*
          if-no-files-found: warn
          retention-days: 14
